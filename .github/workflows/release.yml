name: Release

# Releases are published only when a v* tag is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ic-sync-linux-x86_64
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: ic-sync-linux-aarch64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux GUI / tray build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libudev-dev libdbus-1-dev libgtk-3-dev
          # tray-icon's default Linux backend links AppIndicator3/GTK3
          # (muda-gtk3), so these headers are required, not optional.
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package archive
        run: |
          set -euo pipefail
          staging="${{ matrix.artifact }}"
          mkdir -p "$staging/docs" "$staging/assets"
          cp "target/${{ matrix.target }}/release/ic-sync" "$staging/"
          cp README.md "$staging/"
          cp docs/*.md "$staging/docs/"
          cp assets/* "$staging/assets/"
          tar -czf "$staging.tar.gz" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --workspace --release --target x86_64-pc-windows-msvc

      - name: Package archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "ic-sync-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$stage\docs", "$stage\assets" | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\ic-sync.exe" "$stage\"
          Copy-Item "README.md" "$stage\"
          Copy-Item "docs\*.md" "$stage\docs\"
          Copy-Item "assets\*" "$stage\assets\"
          Compress-Archive -Path "$stage" -DestinationPath "$stage.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ic-sync-windows-x86_64
          path: ic-sync-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ic-sync-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          # Include the source tarball so the AUR packages can verify every
          # download against this single GitHub-hosted checksum file instead
          # of hard-coding hashes in each PKGBUILD.
          version="${GITHUB_REF_NAME#v}"
          source_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$source_url" -o "ic-sync-${version}.tar.gz"; then
              break
            fi
            sleep 10
          done
          test -s "ic-sync-${version}.tar.gz"
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
