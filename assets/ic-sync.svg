<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-labelledby="title desc">
  <title id="title">IC-SYNC</title>
  <desc id="desc">Rounded-square indigo-to-cyan icon showing a cloud with two sync arrows.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="48%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded-square app tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" ry="55.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Cloud, built from overlapping white primitives (single solid silhouette) -->
  <g fill="#ffffff" filter="url(#soft)">
    <circle cx="104" cy="104" r="28"/>
    <circle cx="146" cy="88"  r="38"/>
    <circle cx="184" cy="110" r="26"/>
    <rect x="80" y="104" width="128" height="46" rx="23" ry="23"/>
  </g>

  <!-- Sync arrows, drawn in indigo on top of the white cloud -->
  <g fill="none" stroke="#3730a3" stroke-width="10" stroke-linecap="round">
    <path d="M 106 132 C 100 114, 166 110, 174 132"/>
    <path d="M 174 146 C 180 164, 114 168, 106 146"/>
  </g>
  <g fill="#3730a3">
    <path d="M 166 122 L 182 133 L 165 143 Z"/>
    <path d="M 114 156 L 98 145 L 115 135 Z"/>
  </g>
</svg>
