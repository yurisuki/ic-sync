[package]
name = "ic-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native GUI and system tray for IC-SYNC"

[[bin]]
name = "ic-sync"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
ic-core = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
# The `tokio` backend unlocks Iced's `time::every` subscription and aligns its
# executor with the runtime that drives ic-core.
iced = { workspace = true, features = ["tokio"] }
image = { workspace = true }

# Crate-local extras.
#
# `tray-icon` is declared here instead of via `workspace = true` because the
# workspace entry enables the GTK/libappindicator backend by default.  On Linux
# we deliberately use the pure-Rust KSNI (StatusNotifierItem) backend: it needs
# no GTK event loop and no libappindicator system library, and it is the native
# SNI protocol used by modern desktops.  Cargo cannot override
# `default-features` on an inherited workspace dependency, hence the explicit
# declaration.  On Windows the same crate uses the native Win32 tray.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

# Native directory picker (GTK portal on Linux, IFileDialog on Windows).
rfd = "0.15"
